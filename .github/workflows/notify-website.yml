name: Notify website of docs changes

# The public site (winn.ws) is built from docs/*.md on THIS branch (main).
# The website repo's sync workflow is what actually regenerates and commits
# the HTML that GitHub Pages serves, so it has to be told when docs change.
#
# It previously relied only on a daily cron, which GitHub auto-disables after
# 60 days of repository inactivity (`disabled_inactivity`). That is exactly
# what happened — the site sat on v0.9.2 for months. This makes the sync
# event-driven; the cron stays as a backstop.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger docs sync on gregwinn/winn-lang-website
        env:
          GH_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          if gh api repos/gregwinn/winn-lang-website/dispatches \
               -X POST -f event_type=docs-updated 2>/tmp/err; then
            echo "Dispatched docs-updated to gregwinn/winn-lang-website"
            exit 0
          fi

          cat /tmp/err
          if grep -q "403" /tmp/err; then
            echo "::error title=REPO_TOKEN cannot dispatch to winn-lang-website::\
          REPO_TOKEN is currently scoped to gregwinn/apt.winn.ws and \
          gregwinn/homebrew-winn only. Creating a repository_dispatch needs \
          'Contents: write' on gregwinn/winn-lang-website. Add that repo to \
          the token (Settings > Developer settings > Personal access tokens) \
          and re-run this workflow. Until then winn.ws still updates, but only \
          via the daily cron backstop in the website repo's sync-docs.yml."
          fi
          exit 1
